<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Contatos</title>
</head>
<body>
    <h1>Entre em Contato</h1>
    <p>Ficou com alguma dúvida ou quer falar com a gente? Preencha o formulário abaixo:</p>

    <form method="post" action="">
        <label for="nome">Nome</label><br>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">E-mail</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="mensagem">Mensagem</label><br>
        <textarea id="mensagem" name="mensagem" rows="4" cols="40" required></textarea><br><br>

        <button type="submit">Enviar</button>
    </form>

    <hr>

    <h3>Outras formas de contato</h3>
    <p>Email: contato@seudominio.com</p>
    <p>Telefone: (21) 00000-0000</p>
</body>
</html>
